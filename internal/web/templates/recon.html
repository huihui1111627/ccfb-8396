{{template "header" .}}
<h1>对账</h1>
<div class="card">
<form method="post" action="/recon/run">
 选择表 <select name="table_id">
 {{range .Tables}}<option value="{{.ID}}" {{if .Selected}}selected{{end}}>{{.Label}}</option>{{end}}
 </select>
 <button class="btn" type="submit">执行对账</button>
</form>
</div>
<div class="card">
<table>
<tr><th>ID</th><th>表ID</th><th>时间</th><th>结果</th><th>源行数</th><th>目标行数</th><th>金额汇总(源/目标)</th><th>不一致明细</th></tr>
{{range .Runs}}
<tr>
 <td>{{.ID}}</td><td>{{.TableID}}</td><td>{{.RanAt}}</td>
 <td>{{if eq .Status "ok"}}<span class="tag ok">{{statuscn .Status}}</span>{{else}}<span class="tag bad">{{statuscn .Status}}</span>{{end}}</td>
 <td>{{.SrcCount}}</td><td>{{.TgtCount}}</td>
 <td class="mono">{{.SumsJSON}}</td>
 <td class="mono" style="max-width:480px;overflow:auto;white-space:pre-wrap;font-size:11px">{{.Detail}}</td>
</tr>
{{end}}
</table>
</div>
{{template "footer" .}}
