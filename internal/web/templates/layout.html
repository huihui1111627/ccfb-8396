{{define "header"}}<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>PMS 增量同步控制台</title>
<style>
 body{font-family:-apple-system,"PingFang SC",sans-serif;margin:0;background:#f5f6f8;color:#222}
 nav{background:#1f2937;color:#fff;padding:10px 24px;display:flex;gap:20px;align-items:center}
 nav a{color:#cbd5e1;text-decoration:none;font-size:14px}
 nav a:hover{color:#fff}
 nav .brand{font-weight:700;color:#fff;margin-right:16px}
 main{padding:24px;max-width:1200px;margin:0 auto}
 table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}
 th,td{border:1px solid #e5e7eb;padding:6px 10px;text-align:left}
 th{background:#f3f4f6}
 h1{font-size:20px} h2{font-size:16px}
 .card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:16px;margin-bottom:20px}
 .btn{display:inline-block;background:#2563eb;color:#fff;border:none;border-radius:6px;padding:5px 14px;font-size:13px;cursor:pointer;text-decoration:none}
 .btn.gray{background:#6b7280}.btn.red{background:#dc2626}
 input,select{padding:5px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px}
 .tag{padding:1px 8px;border-radius:10px;font-size:12px}
 .tag.ok{background:#dcfce7;color:#166534}.tag.bad{background:#fee2e2;color:#991b1b}.tag.run{background:#dbeafe;color:#1e40af}.tag.warn{background:#fef9c3;color:#854d0e}
 .err{background:#fee2e2;color:#991b1b;padding:8px 12px;border-radius:6px;margin-bottom:12px}
 .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
 form.inline{display:inline}
</style>
</head>
<body>
<nav>
 <span class="brand">PMS 增量同步</span>
 <a href="/">门店看板</a>
 <a href="/sources">源库登记</a>
 <a href="/batches">同步批次</a>
 <a href="/changes">变更明细</a>
 <a href="/recon">对账</a>
</nav>
<main>
{{end}}

{{define "footer"}}
</main>
</body>
</html>
{{end}}
